<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodFlow | Dashboard</title>
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>
  <main class="dashboard-shell">
    <header class="dashboard-header">
      <a class="brand" href="./dashboard.html" aria-label="FoodFlow dashboard"><img class="brand-logo"
          src="./assets/foodflow-logo.svg" alt=""><span class="brand-name"><span class="brand-food">Food</span><span
            class="brand-flow">Flow</span></span></a>
      <button class="logout-button" id="logoutButton" type="button">Sign out</button>
    </header>
    <section class="dashboard-hero">
      <p class="eyebrow" id="roleLabel">FOODFLOW WORKSPACE</p>
      <h1 id="dashboardTitle">Welcome back.</h1>
      <p id="dashboardMessage">Your workspace is ready.</p>
    </section>
    <section class="dashboard-grid" id="dashboardCards" aria-label="Dashboard overview"></section>
  </main>
  <script src="./js/dashboard.js"></script>
</body>

</html>
