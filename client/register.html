<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodFlow | Create account</title>
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>
  <main class="auth-shell">
    <a class="brand" href="./login.html" aria-label="FoodFlow home"><img class="brand-logo"
        src="./assets/foodflow-logo.svg" alt=""><span class="brand-name"><span class="brand-food">Food</span><span
          class="brand-flow">Flow</span></span></a>
    <section class="login-panel register-panel" aria-labelledby="register-title">
      <div class="panel-heading">
        <p class="eyebrow">JOIN FOODFLOW</p>
        <h1 id="register-title">Create account.</h1>
        <p>Register a student account.</p>
      </div>
      <form id="registerForm">
        <label for="name">Full name</label>
        <div class="input-wrap"><span class="field-icon" aria-hidden="true">&#9787;</span><input id="name" name="name"
            type="text" autocomplete="name" placeholder="Your name" required></div>
        <label for="email">Email address</label>
        <div class="input-wrap"><span class="field-icon" aria-hidden="true">&#9993;</span><input id="email" name="email"
            type="email" autocomplete="email" placeholder="you@student.ruet.ac.bd"
            pattern="[^\s@]+@([a-zA-Z0-9-]+\.)*ruet\.ac\.bd"
            title="Please use your RUET email address (must end with @ruet.ac.bd)."
            required></div>
        <small class="field-hint">Only RUET email addresses (@ruet.ac.bd) can be used to register.</small>
        <label for="password">Password</label>
        <div class="input-wrap"><span class="field-icon" aria-hidden="true">&#128274;</span><input id="password"
            name="password" type="password" autocomplete="new-password" placeholder="8+ characters" required></div>
        <div id="genderField"><label for="gender">Gender</label>
          <div class="input-wrap"><span class="field-icon" aria-hidden="true">&#9673;</span><select id="gender"
            name="gender" required><option value="">Select your gender</option><option value="male">Male</option><option
            value="female">Female</option></select></div></div>
        <label for="confirmPassword">Confirm password</label>
        <div class="input-wrap"><span class="field-icon" aria-hidden="true">&#128274;</span><input id="confirmPassword"
            name="confirmPassword" type="password" autocomplete="new-password" placeholder="Re-enter your password"
            required></div>
        <button type="submit" id="registerButton">Create account <span aria-hidden="true">&#8594;</span></button>
        <p id="registerStatus" class="status" role="status" aria-live="polite"></p>
      </form>
      <p class="auth-switch">Already have an account? <a href="./login.html">Sign in</a></p>
    </section>
  </main>
  <script src="./js/config.js"></script>
  <script src="./js/register.js"></script>
</body>

</html>
