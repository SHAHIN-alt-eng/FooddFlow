<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bKash Demo Payment | FoodFlow</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    :root { --bkash: #e2136e; --ink: #172a22; }
    .bkash-payment-page { min-height: 100vh; display: grid; place-items: center; padding: 32px 18px; background: radial-gradient(circle at 7% 8%, #ffd7e8 0, transparent 30%), radial-gradient(circle at 92% 90%, #ffe5b5 0, transparent 27%), #f7faf8; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    .payment-card { width: min(100%, 500px); overflow: hidden; background: #fff; border: 1px solid #f6d6e5; border-radius: 24px; box-shadow: 0 24px 65px rgba(77, 22, 49, .16); }
    .payment-card__head { padding: 28px 30px 25px; color: #fff; background: linear-gradient(135deg, var(--bkash), #f0568f); position: relative; overflow: hidden; }.payment-card__head::after { content: ''; position: absolute; width: 210px; height: 210px; right: -75px; top: -115px; border: 34px solid rgba(255,255,255,.13); border-radius: 50%; }
    .payment-brand { display: flex; align-items: center; gap: 12px; position: relative; z-index: 1; }.bkash-logo { display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 15px; color: var(--bkash); background: #fff; font-size: 27px; font-weight: 900; letter-spacing: -2px; box-shadow: 0 5px 16px rgba(92, 0, 41, .18); }.payment-brand strong { font-size: 24px; letter-spacing: -.8px; }.payment-brand small { display: block; margin-top: 2px; color: #ffe7f1; font-size: 11px; font-weight: 800; letter-spacing: 1.2px; }
    .payment-card__head h1 { position: relative; z-index: 1; margin: 27px 0 7px; font-size: clamp(26px, 6vw, 34px); color: #fff; letter-spacing: -.8px; }.payment-card__head p { position: relative; z-index: 1; margin: 0; color: #fff0f6; font-size: 15px; }.payment-card__head #amount { color: #fff; font-size: 19px; }.payment-form { padding: 28px 30px 30px; }.payment-field { margin-bottom: 18px; }.payment-field label { display: block; margin: 0 0 8px; color: var(--ink); font-size: 13px; font-weight: 750; }
    .input-wrap { display: flex; align-items: center; gap: 11px; padding: 0 14px; background: #fffafc; border: 1.5px solid #f0c7da; border-radius: 13px; transition: .2s ease; }.input-wrap:focus-within { border-color: var(--bkash); box-shadow: 0 0 0 4px rgba(226,19,110,.12); background: #fff; }.field-icon { width: 21px; height: 21px; flex: 0 0 21px; color: var(--bkash); }.input-wrap input { width: 100%; height: 48px; border: 0; outline: 0; color: #263a30; background: transparent; font: 600 16px/1 Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: .3px; }
    .demo-note { display: flex; gap: 9px; align-items: flex-start; margin: 4px 0 21px; padding: 12px 13px; border-radius: 12px; color: #64515a; background: #fff2f7; font-size: 13px; line-height: 1.4; }.demo-note svg { width: 18px; flex: 0 0 18px; color: var(--bkash); }.form-status { min-height: 18px; margin: -10px 0 14px; color: #a21551; font-size: 13px; }.payment-actions { display: flex; gap: 12px; align-items: center; }.confirm-payment { flex: 1; min-height: 50px; border: 0; border-radius: 13px; cursor: pointer; color: #fff; background: linear-gradient(135deg, var(--bkash), #c70d5a); box-shadow: 0 9px 18px rgba(202, 15, 88, .24); font-size: 15px; font-weight: 800; transition: transform .2s, box-shadow .2s; }.confirm-payment:hover { transform: translateY(-2px); box-shadow: 0 12px 22px rgba(202, 15, 88, .3); }.cancel-payment { padding: 13px 8px; color: #765b67; font-size: 14px; font-weight: 750; text-decoration: none; }.cancel-payment:hover { color: var(--bkash); }
    @media (max-width: 430px) { .payment-card__head, .payment-form { padding-left: 21px; padding-right: 21px; }.payment-card { border-radius: 20px; } }
  </style>
</head>
<body class="bkash-payment-page">
  <main class="payment-card">
    <header class="payment-card__head">
      <div class="payment-brand"><span class="bkash-logo" aria-label="bKash">b</span><span><strong>bKash</strong><small>FOODFLOW SECURE PAYMENT</small></span></div>
      <h1>Demo payment</h1><p>FoodFlow meal payment <strong id="amount">৳0.00</strong></p>
    </header>
    <form id="demoPaymentForm" class="payment-form">
      <p class="demo-note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg><span>This is a local simulation. Do not enter wallet, PIN, or verification details. No money is moved.</span></p>
      <p id="status" class="form-status" aria-live="polite"></p><div class="payment-actions"><button class="confirm-payment" type="submit">Simulate payment confirmation</button><a class="cancel-payment" href="student-dashboard.html">Cancel</a></div>
    </form>
  </main>
  <script src="js/config.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const paymentId = params.get('paymentId');
    const amount = Number(params.get('amount') || 0);
    const status = document.getElementById('status');
    document.getElementById('amount').textContent = `৳${amount.toFixed(2)}`;
    document.getElementById('demoPaymentForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!paymentId) { status.textContent = 'Payment session is missing.'; status.className = 'form-status form-status-error'; return; }
      const token = localStorage.getItem('foodflow_token');
      status.textContent = 'Confirming demo payment…';
      try {
        const response = await fetch(`${window.FOODFLOW_API_BASE_URL}/payments/bkash/execute/${encodeURIComponent(paymentId)}`, { method: 'POST', headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' } });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.success) throw new Error(data.message || 'Payment could not be confirmed.');
        const resultUrl = new URL('payment-result.html', location.href);
        resultUrl.searchParams.set('result', 'success');
        resultUrl.searchParams.set('message', 'Demo payment completed. Your reservation and QR are ready.');
        resultUrl.searchParams.set('reservationId', String(data.reservationId));
        location.assign(resultUrl);
      } catch (error) { status.textContent = error.message; status.className = 'form-status form-status-error'; }
    });
  </script>
</body>
</html>
